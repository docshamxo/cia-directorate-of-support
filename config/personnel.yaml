# Keep committed holders to high-command / small command teams only — no bulk
# membership rosters.
#
# Optional per-holder field: discord_id (numeric Discord user snowflake).
# When set, CoC / contact embeds render the holder as a clickable profile link:
#   [username](https://discord.com/users/<discord_id>)
# How to get an ID: Discord User Settings → Advanced → Developer Mode ON →
# right-click the member → Copy User ID. Does not ping (AllowedMentions.none).

