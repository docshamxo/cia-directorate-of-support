ds:
  motto: WE GO AS ONE
  classification: PUBLIC
  about: 'The **Directorate of Support (DS)** is the Agency''s backbone -- internal security,
    physical protection, and officer readiness.


    Subordinate offices secure the institution from within and train the officers who carry
    the mission forward.'
  offices:
  - Office of Training & Education (OTE)
  - Office of Security (OSEC)
osec:
  motto: PROTECT · DETECT · RESPOND
  about: 'The **Office of Security (OSEC)** is the Agency''s internal security force --
    facility protection, access control, and protocol enforcement across CIA sites.


    Two specialized sub-units handle escalated and high-priority protective taskings.'
  sub_units:
  - Global Response Staff (GRS)
  - Executive Security Detail (ESD)
  grs_esd_tryout_requirements:
  - Communications certification
  - Minimum 2 weeks in OSEC
  - SSA+
  - GS-3+
ote:
  motto: SCIENTIA EST LUX LUCIS
  about: The **Office of Training & Education (OTE)** runs the Agency's **Officer Training
    Program** -- recruiting, instructing, and certifying officers before active duty.
  pillars:
  - title: Recruitment & Selection
    description: Screen and onboard applicants into the officer pipeline before training begins.
  - title: Tradecraft Instruction
    description: Core academy curriculum -- fieldcraft, security protocol, and operational
      discipline prior to deployment.
  - title: Continuing Development
    description: Ongoing education and re-certification so active officers stay current with
      Agency standards.
grs:
  about: Rapid-response security element -- high-threat site security, contingency support,
    and protective reinforcement for field operations.
  tryout_combat_requirement: Strong **offensive** combat ability
esd:
  about: Close-protection unit for senior leadership and designated principals during travel
    and operations.
  tryout_combat_requirement: Strong **defensive** combat ability
copy:
  chain_of_command_intro: 'Use the chain. Raise concerns with your immediate supervisor first.


    Do not bypass an available lower rank to reach senior leadership. Escalate one level
    at a time.'
  affiliation_notice: '**Community project -- not USG/CIA.** This project is **not affiliated with**,
    endorsed by, sponsored by, or connected to the United States Government or the Central Intelligence
    Agency. Community markings (**PUBLIC** / **STAFF** / **CANDIDATE**) are roleplay vocabulary only.'
  property_notice: Property of the Central Intelligence Agency (ROBLOX), Inter Studios
  disclaimer: '**Community project -- not USG/CIA.**


    All text here is marked **PUBLIC**.


    Fiction for a Roblox community. **Not affiliated with** the United States Government or the
    Central Intelligence Agency. Markings are roleplay vocabulary only.'
  disclaimer_links: '**Community project -- not USG/CIA.**


    All text and links listed here are marked **PUBLIC** unless a link note says otherwise.


    Links are community / Roblox resources. **Not affiliated with** the United States Government or
    the Central Intelligence Agency. Markings are roleplay vocabulary only.'
  disclaimer_staff: '**Community project -- not USG/CIA.**


    Channel text uses community markings (**PUBLIC** / **STAFF** / **CANDIDATE**). Linked staff
    materials are **STAFF** unless otherwise noted.


    Staff markings are community access rules -- **not** USG classification. **Not affiliated with**
    the US Government or CIA.'
  important_notice: 'Follow Agency regulations and the **{chain}** chain of command.


    Unauthorized direct contact with command teams is **not permitted**.'
  staff_handling_notice: '**STAFF** -- authorized {unit} personnel only.


    Unauthorized disclosure may result in a **BLACKLIST** from the **{authority}**. Do not share
    outside authorized channels.'
  staff_handling_notice_restricted: 'Marked **STAFF** unless otherwise noted.


    Unauthorized disclosure results in a **BLACKLIST** from the **{authority}**. Do not share
    outside authorized channels.'
  marking_public: 'Marking: PUBLIC.'
  marking_staff: 'Marking: STAFF.'
  marking_candidate: 'Marking: CANDIDATE.'

