ds:
  motto: WE GO AS ONE
  classification: PUBLIC
  about: 'The **Directorate of Support (DS)** is the Agency''s backbone -- internal security,
    physical protection, and officer readiness.


    Subordinate offices secure the institution from within and train the officers who carry
    the mission forward.'
  offices:
  - Office of Training & Education (OTE)
  - Office of Security (OSEC)
osec:
  motto: PROTECT · DETECT · RESPOND
  about: The frontline defence of our installations. OSEC mans every primary access
    point, repels hostile raids and enforces the Agency Codex.
  sub_units:
  - Global Response Staff (GRS)
  - Executive Security Detail (ESD)
ote:
  motto: SCIENTIA EST LUX LUCIS
  about: Runs specialist training and the Officer Candidate Program, and coordinates
    Agency-wide events.
  pillars:
  - title: Recruitment & Selection
    description: Screen and onboard applicants into the officer pipeline before training begins.
  - title: Tradecraft Instruction
    description: Core academy curriculum -- fieldcraft, security protocol, and operational
      discipline prior to deployment.
  - title: Continuing Development
    description: Ongoing education and re-certification so active officers stay current with
      Agency standards.
grs:
  about: 'OSEC''s rapid-response element, deployed to secure Agency personnel and assets
    wherever they are threatened.'
esd:
  about: Provides close protection for Agency leadership and high-value personnel.
copy:
  chain_of_command_intro: 'Use the chain. Raise concerns with your immediate supervisor first.


    Do not bypass an available lower rank to reach senior leadership. Escalate one level
    at a time.'
  affiliation_notice: '**Community project -- not USG/CIA.** This project is **not affiliated with**,
    endorsed by, sponsored by, or connected to the United States Government or the Central Intelligence
    Agency. Nothing here is an official government communication. Community markings (**PUBLIC** /
    **STAFF** / **CANDIDATE**) are roleplay vocabulary only -- not USG classification.


    **Property of the Central Intelligence Agency (ROBLOX), Inter Studios**'
  property_notice: Property of the Central Intelligence Agency (ROBLOX), Inter Studios
  disclaimer: '**Community project -- not USG/CIA.**


    All text here is marked **PUBLIC**.


    This Discord content is fiction for a Roblox community. It is **not affiliated with**
