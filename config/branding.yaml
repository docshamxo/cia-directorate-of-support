# Legal / brand line (Discord closers use Classification Levels; property lives in docs/NOTICE).
property_notice: "Property of the Central Intelligence Agency (ROBLOX), Invictus Studios"

colors:
  ds: '0x1E3F78'
  osec: '0x1E3F78'
  ote: '0x1E3F78'
  grs: '0xFFD700'
  esd: '0xC0C0C0'
logos:
  ds: DS.png
  ote: OTE.png
  osec: OSEC.png
  grs: GRS.png
  esd: ESD.png
# Webhook usernames: CIA {Office} Bot. See docs/BRAND.md / LICENSE.
bots:
  ds: CIA Directorate of Support Bot
  osec: CIA Office of Security Bot
  ote: CIA Office of Training & Education Bot
  grs: CIA Global Response Staff Bot
  esd: CIA Executive Security Detail Bot

link_label_prefix: "CIA DS"

