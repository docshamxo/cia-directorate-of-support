# Extends the default ruleset shipped with gitleaks (CI pins v8.30.1).
# Only document false positives here - never blanket-ignore real secrets.

[extend]
useDefault = true

# Discord user snowflakes (`discord_id` in CoC personnel) power clickable
# profile links: https://discord.com/users/<id>
# The default `discord-client-id` rule treats 18-digit IDs near "discord" as
# OAuth application client IDs - false positive for public user IDs.
[[allowlists]]
targetRules = ["discord-client-id"]
description = "Discord user snowflakes in CoC personnel and announcer fixtures (not OAuth client IDs)"
paths = [
  '''(^|/)config/personnel\.ya?ml$''',
  '''(^|/)tests/test_announcer\.py$''',
  '''(^|/)tests/test_roblox_coc_sync\.py$''',
]

